[project]
name = "tclock"
version = "0.1.0"
description = "A clock, timer, stopwatch and countdown for your terminal, built with Textual"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eivind Teig", email = "eivind.teig@gmail.com" }]
requires-python = ">=3.14"
keywords = ["clock", "timer", "stopwatch", "countdown", "tui", "textual", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=8.0",
    "typer>=0.15",
    "platformdirs>=4.0",
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/eivl/tclock"
Repository = "https://github.com/eivl/tclock"
Issues = "https://github.com/eivl/tclock/issues"
Original = "https://github.com/race604/clock-tui"

[project.scripts]
tclock = "tclock.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
