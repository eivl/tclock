[project]
name = "tclock"
version = "1.3.0"
description = "A clock, timer, stopwatch and countdown for your terminal, built with Textual"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eivind Teig", email = "eivind.teig@gmail.com" }]
requires-python = ">=3.10"
keywords = ["clock", "timer", "stopwatch", "countdown", "tui", "textual", "terminal"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=8.0",
    "typer>=0.15",
    "platformdirs>=4.0",
    "shellingham>=1.5",
    "tzdata; sys_platform == 'win32'",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/eivl/tclock"
Repository = "https://github.com/eivl/tclock"
Issues = "https://github.com/eivl/tclock/issues"
Original = "https://github.com/race604/clock-tui"

[project.scripts]
tclock = "tclock.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "tox>=4.23",
    "tox-uv>=1.20",
    "tomli>=2.0",  # so mypy can check the Python < 3.11 branch on any interpreter
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "shellingham"
ignore_missing_imports = true
