[tox]
# Run with `uv run tox` (or `uv run tox -e py310`). tox-uv creates the
# environments with uv, which downloads any missing interpreter.
requires =
    tox>=4.23
    tox-uv>=1.20
env_list = py3{10,11,12,13,14,15}, lint, type

[testenv]
description = run the test suite on {base_python}
package = wheel
wheel_build_env = .pkg
dependency_groups = dev
set_env =
    PYTHONUTF8 = 1
commands =
    pytest {posargs}

[testenv:lint]
description = ruff check and format check
skip_install = true
commands =
    ruff check .
    ruff format --check .

[testenv:type]
description = mypy on the lowest supported Python
base_python = py310
commands =
    mypy src
