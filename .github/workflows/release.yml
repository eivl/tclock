name: Release

# Every pull request merged into main cuts a release. The bump size comes from
# the PR's labels: release:major, release:minor, otherwise patch. A PR labelled
# skip-release is merged without a release. Manual dispatch remains available
# for rc/stable bumps or re-runs.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        default: patch
        options: [patch, minor, major, rc, stable]

permissions:
  contents: write

# Serialise releases so two quick merges cannot bump from the same base.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       !contains(github.event.pull_request.labels.*.name, 'skip-release'))
    runs-on: ubuntu-latest
    steps:
      # Push with a deploy key rather than GITHUB_TOKEN: the key can bypass the
      # main branch ruleset, and its pushes trigger CI and Publish normally.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
      - name: Choose bump size
        id: size
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          MAJOR: ${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}
          MINOR: ${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            bump="$INPUT_BUMP"
          elif [ "$MAJOR" = "true" ]; then
            bump=major
          elif [ "$MINOR" = "true" ]; then
            bump=minor
          else
            bump=patch
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
      - name: Bump version
        id: bump
        env:
          BUMP: ${{ steps.size.outputs.bump }}
        run: |
          uv version --bump "$BUMP" --no-sync
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"
          # Atomic: if main is rejected, the tag is not pushed either.
          git push --atomic origin main "v${VERSION}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "v${VERSION}" --verify-tag --title "v${VERSION}" --generate-notes
