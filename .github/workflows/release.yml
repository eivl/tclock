name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        default: patch
        options: [patch, minor, major, rc, stable]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # Push with a deploy key rather than GITHUB_TOKEN: the key can bypass the
      # main branch ruleset, and its pushes trigger CI and Publish normally.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
      - name: Bump version
        id: bump
        run: |
          uv version --bump "${{ inputs.bump }}" --no-sync
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"
          # Atomic: if main is rejected, the tag is not pushed either.
          git push --atomic origin main "v${VERSION}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "v${VERSION}" --verify-tag --title "v${VERSION}" --generate-notes
