# Groups merged pull requests into sections in generated release notes.
# Only PRs show up here; direct commits to main are not listed.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Features
      labels: [enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: CI and tooling
      labels: [ci]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
